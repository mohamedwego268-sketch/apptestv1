<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>نموذج تفاعلي للتطبيق</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:#E9E1F7;font-family:Cairo,sans-serif;color:#2A1A40;display:flex;justify-content:center}
#ph{width:100%;max-width:430px;height:100dvh;max-height:900px;position:relative;overflow:hidden;background:#fff}
#sc{position:absolute;inset:0 0 86px 0;overflow-y:auto;padding:44px 14px 16px;display:flex;flex-direction:column;gap:10px;scrollbar-width:none}
.t-home{background:linear-gradient(180deg,#FFD9EA,#E8E0FB 55%,#D2EEFB)}.t-rt{background:linear-gradient(180deg,#D9F6E8,#FFF2C9)}.t-ai{background:linear-gradient(180deg,#E6DCFF,#FFD9EA)}.t-ex{background:linear-gradient(180deg,#FFEFC2,#FFD6BF 60%,#F3DAFA)}.t-megirl{background:linear-gradient(180deg,#FFD0E4,#FFEFF6)}.t-meboy{background:linear-gradient(180deg,#C9EBFA,#EAF8FF)}
#tb{position:absolute;top:8px;right:12px;left:12px;display:flex;justify-content:space-between;z-index:5}.pill{padding:4px 12px;border-radius:14px;background:rgba(255,255,255,.92);font:700 11px Cairo;border:0;color:#6B3FA0}
.c{background:rgba(255,255,255,.82);border-radius:20px;padding:12px;box-shadow:0 6px 16px rgba(110,80,170,.1)}.r{display:flex;align-items:center;gap:10px}.g{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.h{font-weight:700;font-size:16px}.s{font-size:12px;color:#6B3FA0}.s2{font-size:12px;font-weight:600}.w{font-weight:600}
.b{border:0;border-radius:16px;min-height:42px;padding:0 16px;font:700 14px Cairo;color:#fff;background:linear-gradient(135deg,#F2699F,#8C7CE6 60%,#4FB4DA);cursor:pointer}.b.o{background:#fff;color:#6B3FA0;border:1.5px solid #D9C6F0}.b.sm{min-height:34px;padding:0 12px;font-size:12px}
.k-pk{background:linear-gradient(135deg,#FF9CC4,#F2699F);color:#fff}.k-bl{background:linear-gradient(135deg,#8ADBF0,#4FB4DA);color:#06303F}.k-yl{background:linear-gradient(135deg,#FFE08A,#FFC94D);color:#4A3500}.k-gn{background:linear-gradient(135deg,#9BE8C4,#5CCB9B);color:#063B25}.k-pu{background:linear-gradient(135deg,#B8ADF5,#8C7CE6);color:#fff}.k-or{background:linear-gradient(135deg,#FFBE8C,#FF9A5C);color:#4A2200}.k-tl{background:linear-gradient(135deg,#8FE3E0,#3FC1C0);color:#053A3A}
.chip{padding:6px 12px;border-radius:14px;background:#fff;font:600 12px Cairo;border:1.5px solid #EADDF7;color:#6B3FA0;cursor:pointer;white-space:nowrap}.chip.on{background:#8C7CE6;color:#fff;border-color:#8C7CE6}.row{display:flex;gap:6px;flex-wrap:wrap}
.hero{position:relative;border-radius:26px;overflow:hidden;box-shadow:0 10px 26px rgba(120,90,180,.2)}.hg{position:absolute;bottom:10px;right:14px;left:14px;background:rgba(255,255,255,.85);border-radius:16px;padding:8px 12px}
.bob{animation:bob 2.4s ease-in-out infinite}.d1{animation-delay:.4s}.d2{animation-delay:.8s}.d3{animation-delay:1.2s}@keyframes bob{50%{transform:translateY(-5px)}}
.kid{flex:1;border:0;border-radius:20px;padding:8px;display:flex;align-items:center;gap:8px;font:700 14px Cairo;cursor:pointer;opacity:.7}.kid.sel{opacity:1;box-shadow:0 0 0 3px #fff,0 0 0 5px #8C7CE6}.kid svg{border-radius:50%}
.tk{cursor:pointer}.chk{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #fff;font-weight:700}.dn{opacity:.6}.dn .w{text-decoration:line-through}
.tile{border:0;border-radius:22px;padding:14px;min-height:92px;text-align:right;font:700 15px Cairo;cursor:pointer}.tile .s2{display:block;margin-top:4px;opacity:.85}
.pc{background:rgba(255,255,255,.85);border-radius:20px;padding:8px;cursor:pointer}.pc svg{border-radius:16px;display:block}
.vid{position:relative;border-radius:20px;overflow:hidden}.pl{position:absolute;inset:0;margin:auto;width:54px;height:54px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:#8C7CE6;font-size:20px;cursor:pointer}
.ball{transform-box:fill-box;transform-origin:center}.pl-on .ball{animation:bn .5s ease-in-out infinite alternate}@keyframes bn{to{transform:translateY(-44px)}}
.bar{height:8px;border-radius:4px;background:rgba(140,124,230,.2);overflow:hidden;cursor:pointer}.bar i{display:block;height:100%;background:linear-gradient(90deg,#F2699F,#8C7CE6,#4FB4DA)}
.wv{display:flex;gap:3px;align-items:center;height:34px}.wv i{width:4px;height:100%;border-radius:2px;background:#8C7CE6;transform:scaleY(.3)}.pl-on .wv i{animation:wv .7s ease-in-out infinite alternate}.wv i:nth-child(3n){animation-delay:.2s;background:#F2699F}.wv i:nth-child(3n+1){animation-delay:.4s;background:#4FB4DA}@keyframes wv{to{transform:scaleY(1)}}
.stars{display:flex;gap:6px;justify-content:center;font-size:30px;color:#FFC94D;margin:10px 0}.stars i{font-style:normal;animation:bob 1.6s infinite}
.in{width:100%;min-height:42px;border:1.5px solid #E3D6F5;border-radius:14px;padding:0 12px;font:400 14px Cairo;background:#fff}
.bub{max-width:80%;padding:9px 13px;border-radius:16px;font-size:13px}.me{align-self:flex-end;color:#fff;background:linear-gradient(135deg,#F2699F,#8C7CE6)}.bt{align-self:flex-start;background:#fff}
#nv{position:absolute;bottom:calc(10px + env(safe-area-inset-bottom,0px));left:12px;right:12px;display:flex;gap:4px;padding:6px;border-radius:28px;background:rgba(255,255,255,.94);box-shadow:0 10px 26px rgba(110,80,170,.25)}
.nb{flex:1;border:0;border-radius:22px;background:none;color:#5A3A7A;font:600 10px Cairo;min-height:48px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}.nb.on{background:linear-gradient(135deg,#F2699F,#8C7CE6);color:#fff}
#sh{position:absolute;inset:0;z-index:20;background:rgba(40,20,70,.45);display:flex;align-items:flex-end}#sh:empty{display:none}#sh>div{background:#fff;width:100%;border-radius:26px 26px 0 0;padding:16px;max-height:88%;overflow:auto;display:flex;flex-direction:column;gap:10px}
#ts{position:absolute;bottom:100px;left:50%;transform:translateX(-50%);background:#2A1A40;color:#fff;padding:8px 16px;border-radius:16px;font-size:13px;z-index:40;opacity:0;transition:.3s;pointer-events:none;text-align:center}#ts.on{opacity:1}
.cf{position:absolute;top:55%;width:8px;height:12px;border-radius:2px;animation:fly .9s ease-out forwards;z-index:30}@keyframes fly{to{transform:translate(var(--x),var(--y)) rotate(540deg);opacity:0}}
.sc{position:relative;height:60px}.sc i{position:absolute;top:8px;font-style:normal;font-size:30px;animation:mv 4s linear forwards}@keyframes mv{from{right:0}to{right:80%}}
button:focus-visible{outline:3px solid #6B3FA0}
</style></head><body>
<div id="ph"><div id="tb"><button class="pill" data-a="lang">ع | EN</button><button class="pill" data-a="cty" id="cb"></button></div><div id="sc"></div><nav id="nv"></nav><div id="sh"></div><div id="ts"></div></div>
<script>
const $=s=>document.querySelector(s);
const AVC={boy:['#CFEFFA','#7A4A2A','#4FB4DA'],girl:['#FFD3E6','#6B3A22','#F2699F'],dad:['#DDE7FF','#3B2A20','#6B7FE0'],mom:['#F3D9FF','#4A2B1F','#C77DDB']};
const face=(k,x,y,s)=>{const [bg,h,sh]=AVC[k];return `<g transform="translate(${x} ${y}) scale(${s})">${k=='girl'?`<circle cx="-15" cy="-12" r="7" fill="${h}"/><circle cx="15" cy="-12" r="7" fill="${h}"/>`:''}${k=='mom'?`<path d="M-19 0a19 19 0 0 1 38 0v26h-38z" fill="${h}"/>`:''}<rect x="-15" y="20" width="30" height="30" rx="13" fill="${sh}"/><circle r="16" fill="#F5CBA7"/><path d="M-16 -1a16 16 0 0 1 32 0q-16-9-32 0z" fill="${h}"/><circle cx="-5.5" cy="2" r="1.9" fill="#2A1A40"/><circle cx="5.5" cy="2" r="1.9" fill="#2A1A40"/><circle cx="-10" cy="7" r="2.4" fill="#F29BB5" opacity=".6"/><circle cx="10" cy="7" r="2.4" fill="#F29BB5" opacity=".6"/><path d="M-5 8q5 4 10 0" stroke="#C0524A" stroke-width="1.8" fill="none" stroke-linecap="round"/></g>`};
const av=(k,s=40)=>`<svg width="${s}" height="${s}" viewBox="-34 -30 68 68" style="background:${AVC[k][0]};border-radius:50%">${face(k,0,-2,.9)}</svg>`;
const fam=()=>`<svg viewBox="0 0 360 200" width="100%" style="display:block"><defs><linearGradient id="sk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD3E6"/><stop offset="1" stop-color="#CFEFFA"/></linearGradient></defs><rect width="360" height="200" fill="url(#sk)"/><circle cx="305" cy="42" r="22" fill="#FFC94D"/><ellipse cx="60" cy="215" rx="150" ry="60" fill="#8FDDB5"/><ellipse cx="300" cy="220" rx="170" ry="62" fill="#5CCB9B"/><g class="bob">${face('dad',105,82,1.55)}</g><g class="bob d1">${face('mom',178,86,1.5)}</g><g class="bob d2">${face('boy',245,112,1.2)}</g><g class="bob d3">${face('girl',302,114,1.2)}</g></svg>`;
const ART={bottle:'<rect x="38" y="30" width="24" height="52" rx="10" fill="#fff" stroke="#4FB4DA" stroke-width="3"/><rect x="38" y="54" width="24" height="12" fill="#CFEFFA"/><rect x="42" y="18" width="16" height="14" rx="5" fill="#F2699F"/><rect x="45" y="10" width="10" height="8" rx="4" fill="#FFC94D"/>',diaper:'<rect x="22" y="24" width="56" height="58" rx="10" fill="#4FB4DA"/><circle cx="50" cy="46" r="14" fill="#fff"/><path d="M44 48q6 6 12 0" stroke="#F2699F" fill="none" stroke-width="3" stroke-linecap="round"/><rect x="30" y="66" width="40" height="8" rx="4" fill="#fff"/>',stroller:'<path d="M20 30h26a22 22 0 0 1-22 28H20z" fill="#F2699F"/><path d="M46 30l22 4v36M24 58h40" stroke="#6B3FA0" stroke-width="4" fill="none"/><circle cx="30" cy="76" r="9" fill="#2A1A40"/><circle cx="64" cy="76" r="9" fill="#2A1A40"/>',teddy:'<circle cx="30" cy="26" r="10" fill="#B9753F"/><circle cx="70" cy="26" r="10" fill="#B9753F"/><circle cx="50" cy="42" r="22" fill="#C98B52"/><circle cx="50" cy="76" r="20" fill="#C98B52"/><circle cx="42" cy="40" r="2.5" fill="#2A1A40"/><circle cx="58" cy="40" r="2.5" fill="#2A1A40"/><ellipse cx="50" cy="48" rx="7" ry="5" fill="#F5D2A8"/><path d="M42 82q8 6 16 0" stroke="#F2699F" stroke-width="4" fill="none"/>',dress:'<path d="M38 18h24l8 16-10 6 16 44H24l16-44-10-6z" fill="#F2699F"/><path d="M38 18q12 12 24 0" fill="#FFD3E6"/><circle cx="50" cy="56" r="4" fill="#FFC94D"/>',blocks:'<rect x="20" y="52" width="30" height="30" rx="4" fill="#4FB4DA"/><rect x="50" y="52" width="30" height="30" rx="4" fill="#FFC94D"/><rect x="35" y="22" width="30" height="30" rx="4" fill="#F2699F"/><text x="50" y="44" font-size="20" font-weight="700" fill="#fff" text-anchor="middle">A</text>'};
const art=k=>`<svg viewBox="0 0 100 100" width="100%">${ART[k]}</svg>`;
const PR=[['bottle','زجاجة رضاعة',65,'#CFEFFA'],['diaper','حفاضات مقاس 4',149,'#FFD3E6'],['stroller','عربية أطفال',899,'#E6DDFB'],['teddy','دبدوب',179,'#FFF0C8'],['dress','فستان بناتي',179,'#FFD3E6'],['blocks','مكعبات تعليمية',89,'#D8F5E8']];
const poster=()=>`<svg viewBox="0 0 340 190" width="100%" style="display:block"><rect width="340" height="190" fill="#CFEFFA"/><circle cx="290" cy="38" r="20" fill="#FFC94D"/><ellipse cx="170" cy="205" rx="230" ry="60" fill="#8FDDB5"/>${face('girl',110,92,1.3)}${face('boy',200,98,1.2)}<circle class="ball" cx="270" cy="150" r="14" fill="#F2699F"/></svg>`;
const IC={home:'M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',rt:'M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01',ai:'M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z',ex:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20zM16 8l-2 6-6 2 2-6z',me:'M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z'};
const NV=[['home','الرئيسية'],['rt','الروتين'],['ai','المساعد'],['ex','اكتشف'],['me','حسابي']];
const KID={girl:{n:'ليلى',a:'3 سنين',k:'pk'},boy:{n:'يوسف',a:'8 شهور',k:'bl'}};
const TK={girl:[['حقيبة الحضانة','7:30 ص'],['حصة رسم','5:00 م'],['فيتامين','8:00 م']],boy:[['فيتامين د','10:30 ص'],['رضاعة','2:00 م'],['نوم الظهر','3:30 م']]};
const TIP='جرّب تخلّي ليلى تشارك في تحضير الأكل النهارده، ده بيشجعها تجرب أصناف جديدة.';
const SV={'طبي':[['صيدلية [الاسم]',.4,4.8,310,'مفتوحة'],['عيادة أطفال [الاسم]',1.2,4.7,150,'تحجز اليوم'],['معمل تحاليل [الاسم]',2.3,4.5,90,'سحب منزلي'],['مستشفى [الاسم]',3.2,4.6,540,'طوارئ']],'تعليمي':[['حضانة [الاسم]',1.8,4.6,230,'تسجيل مفتوح'],['مكتبة [الاسم]',.9,4.5,60,'كتب وأدوات'],['مركز كورسات [الاسم]',2.4,4.7,85,'كورس [ ]']],'ترفيه':[['نادي [الاسم]',2,4.5,140,'اشتراك شهري'],['ملعب [الاسم]',1.3,4.4,75,'مفتوح'],['ورشة [الاسم]',3.5,4.8,50,'السبت']],'أسرة':[['جليسة موثّقة',1.1,4.7,40,'متاحة'],['مصور مناسبات',4,4.6,30,'حجز']]};
const RP={'النوم':'جرّب روتين ثابت: استحمام، قصة، إضاءة هادية. سجّل مواعيد نومه أسبوع وأنا أحلّلها لك.','الأكل':'قدّم الخضار بأشكال مختلفة وخلّيه يشارك في التحضير. لو شاكّين في نقص، اسألوا الدكتور قبل أي مكمل.','التركيز':'جلسات قصيرة 10 دقايق بينها راحة، وقلّل الشاشة قبل المذاكرة.','السلوك':'سمّي مشاعره ("إنت زعلان؟") وحدّد حدود واضحة وهادية. لو الموضوع مستمر، كلّم مختص.'};
const S={tab:'home',sub:null,kid:'girl',c:'eg',stars:0,done:{},cart:{},sel:null,sheet:null,tr:0,liked:{},chat:[['bt','أهلاً! أنا [المساعد]. اسألني عن نوم وأكل وتركيز وسلوك الطفل.']],posts:[{n:'ماما نهى',t:'بنتي 3 سنين ومش بتاكل خضار، جربتوا إيه؟',l:12,cm:['ماما هبة: خليتها تشارك في الطبخ ونفع']}],ans:{},res:null,pl:{v:0,a:0,vp:0,ap:0},game:{n:3,o:[2,3,4],ok:0},loc:false,svc:'طبي',pm:0};
const cur=()=>S.c=='eg'?'ج':'ر.س',px=p=>(S.c=='eg'?p:Math.max(1,Math.round(p/13)))+' '+cur(),tm=s=>{s=Math.floor(s);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')};
const ring=(d,t)=>`<svg width="60" height="60" viewBox="0 0 60 60"><circle cx="30" cy="30" r="25" fill="none" stroke="#EADDF7" stroke-width="7"/><circle cx="30" cy="30" r="25" fill="none" stroke="#8C7CE6" stroke-width="7" stroke-linecap="round" stroke-dasharray="157" stroke-dashoffset="${157-157*d/t}" transform="rotate(-90 30 30)"/><text x="30" y="35" text-anchor="middle" font-size="14" font-weight="700" fill="#2A1A40">${d}/${t}</text></svg>`;
const chips=(arr,key)=>`<div class="row">${arr.map(x=>`<button class="chip${S.ans[key]==x?' on':''}" data-a="an" data-k="${key}" data-v="${x}">${x}</button>`).join('')}</div>`;
const tasks=()=>{const T=TK[S.kid],k=KID[S.kid].k;return T.map((t,i)=>`<div class="c r tk${S.done[S.kid+i]?' dn':''}" data-a="task" data-v="${i}"><div class="chk k-${k}">${S.done[S.kid+i]?'&#10003;':''}</div><div style="flex:1"><div class="w">${t[0]}</div><div class="s">${t[1]}</div></div><span class="chip">+1 نجمة</span></div>`).join('')};
const VIEW={
home(){const T=TK[S.kid],d=T.filter((_,i)=>S.done[S.kid+i]).length;return `<div class="hero">${fam()}<div class="hg"><div class="h">أهلاً بعائلتك</div><div class="s">[اليوم] · [الحرارة] · لبس خفيف النهارده</div></div></div><div class="r">${['girl','boy'].map(x=>`<button class="kid k-${KID[x].k}${S.kid==x?' sel':''}" data-a="kid" data-v="${x}">${av(x,38)}<span>${KID[x].n}<br><span class="s2">${KID[x].a}</span></span></button>`).join('')}</div><div class="c r">${ring(d,T.length)}<div style="flex:1"><div class="h">مهام ${KID[S.kid].n} النهارده</div><div class="s">${d} من ${T.length} · ${S.stars} نجمة</div></div></div>${tasks()}<div class="g">${[['الخدمات','svc','gn','أقرب دكتور وحضانة'],['المتجر','shop','pu','ملابس وألعاب'],['تعلّم وسمّع','learn','or','فيديو وبودكاست'],['المجتمع','com','tl','أمهات وآباء']].map(x=>`<button class="tile k-${x[2]}" data-a="go" data-v="${x[1]}">${x[0]}<span class="s2">${x[3]}</span></button>`).join('')}</div><div class="c r k-yl"><div style="flex:1"><div class="s2">نصيحة اليوم</div><div class="w">${TIP}</div></div><button class="b sm" data-a="say">استمع</button></div>`},
rt(){const q=S.ans,r=S.res;return `<h1 class="h" style="font-size:20px;margin:0">الروتين اليومي</h1>${tasks()}<div class="c"><div class="h">أسئلة الصبح</div><div class="s">نام امتى؟</div>${chips(['9 م','10 م','11 م','بعد 11'],'sl')}<div class="s" style="margin-top:6px">صحي امتى؟</div>${chips(['6','7','8','بعد 8'],'wk')}</div><div class="c"><div class="h">أسئلة المساء</div><div class="s">المزاج</div>${chips(['كويس','عادي','زعلان'],'md')}<div class="s" style="margin-top:6px">التركيز</div>${chips(['مركز','متوسط','مش مركز'],'fc')}<div class="s" style="margin-top:6px">وقت الشاشة</div>${chips(['أقل من ساعة','1-2 ساعة','أكتر من 2'],'sr')}<button class="b" style="width:100%;margin-top:10px" data-a="calc">حلّل يومنا</button></div>${r?`<div class="c k-${r.k}"><div class="h">${r.t}</div><div>${r.m}</div></div>`:''}<div class="c"><div class="s2">النوم هذا الأسبوع</div><div class="r" style="align-items:flex-end;height:60px;gap:6px">${[36,40,34,44,38,46,r&&r.k=='gn'?56:40].map((h,i)=>`<div class="k-${i==6?'pk':'bl'}" style="flex:1;height:${h}px;border-radius:6px 6px 0 0"></div>`).join('')}</div></div>`},
ai(){return `<h1 class="h" style="font-size:20px;margin:0">المساعد</h1><div class="c r">${av('mom',40)}<div style="flex:1"><div class="w">[اسم المساعد]</div><div class="s">عن ${KID[S.kid].n} · ${KID[S.kid].a}</div></div></div>${S.chat.map(m=>`<div class="bub ${m[0]=='me'?'me':'bt'}">${m[1]}</div>`).join('')}<div class="row">${['النوم','الأكل','التركيز','السلوك'].map(x=>`<button class="chip" data-a="ask" data-v="${x}">${x}</button>`).join('')}</div><div class="r"><input class="in" id="qi" aria-label="اسأل" placeholder="اسأل عن ${KID[S.kid].n}"><button class="b sm" data-a="send" aria-label="إرسال">&#10148;</button></div><div class="s" style="text-align:center">إرشادي ومش بديل عن الدكتور</div>`},

me(){const k=KID[S.kid],hs=[40,52,64,76,88,100];return `<div class="r" style="justify-content:center;gap:14px">${['girl','boy'].map(x=>`<button class="kid k-${KID[x].k}${S.kid==x?' sel':''}" data-a="kid" data-v="${x}" style="flex:none;padding:10px">${av(x,48)}<span>${KID[x].n}</span></button>`).join('')}</div><div class="c" style="text-align:center">${av(S.kid,80)}<div class="h">${k.n}</div><div class="s">${k.a} · فصيلة الدم O+</div></div><div class="c"><div class="h">النمو</div><div class="r" style="align-items:flex-end;height:90px;gap:8px">${hs.map(h=>`<div class="k-${k.k}" style="flex:1;height:${h}px;border-radius:8px 8px 0 0"></div>`).join('')}</div></div><div class="c"><div class="h">التطعيمات</div>${[['الجرعة المنشطة','تمت'],['التطعيم القادم','12 نوفمبر']].map((x,i)=>`<div class="r" style="padding:6px 0"><div class="chk k-${k.k}">${i?'':'&#10003;'}</div><span class="w" style="flex:1">${x[0]}</span><span class="chip">${x[1]}</span></div>`).join('')}</div><button class="b" data-a="sh" data-v="em">بطاقة الطوارئ</button>`},
svc(){const L=SV[S.svc].slice().sort((a,b)=>S.loc?a[1]-b[1]:b[2]-a[2]);return `<div class="row">${Object.keys(SV).map(x=>`<button class="chip${S.svc==x?' on':''}" data-a="sv" data-v="${x}">${x}</button>`).join('')}</div><div class="c r"><div style="flex:1"><div class="w">${S.loc?'الموقع مفعّل: [المنطقة]':'فعّل الموقع لنجيبلك الأقرب'}</div></div><button class="b sm" data-a="loc">${S.loc?'إيقاف':'تفعيل'}</button></div>${L.map(x=>`<div class="c r"><div class="chk k-gn" style="width:40px;height:40px"></div><div style="flex:1"><div class="w">${x[0]}</div><div class="s">${S.loc?x[1]+' كم · ':''}${x[4]}</div><div class="s2" style="color:#C42A78">&#9733; ${x[2]} (${x[3]})</div></div><button class="b sm" data-a="sh" data-v="bk">احجز</button></div>`).join('')}<div class="c k-yl s2">إعلان ممول: [اسم المكان] · [عرض]</div>`},
shop(){const n=Object.values(S.cart).reduce((a,b)=>a+b,0);const p=S.sel!=null?PR[S.sel]:null;return `<div class="r"><div class="h" style="flex:1">المتجر</div><button class="b sm" data-a="sh" data-v="cart">السلة ${n}</button></div>${p?`<div class="c"><div style="background:${p[3]};border-radius:18px">${art(p[0])}</div><div class="h" style="margin-top:6px">${p[1]}</div><div class="r"><span class="h" style="flex:1;color:#C42A78">${px(p[2])}</span>${RTG}</div><div class="r" style="margin-top:8px"><button class="b" style="flex:1" data-a="add" data-v="${S.sel}">أضف للسلة</button><button class="b o" data-a="sel" data-v="">رجوع</button></div></div>`:`<div class="row">${['الكل','بنات','أولاد','ألعاب','رضاعة'].map((x,i)=>`<button class="chip${i?'':' on'}">${x}</button>`).join('')}</div><div class="c k-yl s2">خصم أول طلب</div><div class="g">${PR.map((x,i)=>`<div class="pc" data-a="sel" data-v="${i}"><div style="background:${x[3]}">${art(x[0])}</div><div class="w" style="margin-top:4px">${x[1]}</div><div class="r"><span class="s2" style="color:#C42A78;flex:1">${px(x[2])}</span><span class="s">&#9733; 4.6</span></div></div>`).join('')}</div>`}`},
learn(){return `<div class="vid" id="vid"><div>${poster()}</div><button class="pl" data-a="pv">${S.pl.v?'&#10074;&#10074;':'&#9654;'}</button></div><div class="c"><div class="h">فيديو: [عنوان الفيديو]</div><div class="bar" data-a="seek" data-w="v"><i id="vp" style="width:${S.pl.vp}%"></i></div><div class="s" id="vt">${tm(S.pl.vp*1.8)} / 3:00</div></div><div class="c" id="aud"><div class="r"><div class="dot k-pu" style="width:54px;height:54px;border-radius:16px"></div><div style="flex:1"><div class="h">بودكاست: [العنوان]</div><div class="s">[اسم الحلقة] · 4:00</div></div><button class="b sm" data-a="pa">${S.pl.a?'إيقاف':'شغّل'}</button></div><div class="wv">${'<i></i>'.repeat(28)}</div><div class="bar" data-a="seek" data-w="a"><i id="ap" style="width:${S.pl.ap}%"></i></div><div class="s" id="at">${tm(S.pl.ap*2.4)} / 4:00</div></div><div class="c"><div class="h">لعبة العد</div><div class="s">عدّ النجوم · نجومك ${S.stars}</div><div class="stars">${'<i>&#9733;</i>'.repeat(S.game.n)}</div><div class="r" style="justify-content:center">${S.game.o.map(v=>`<button class="b k-${['pk','bl','yl'][v%3]}" style="min-width:64px;min-height:56px;font-size:22px" data-a="gm" data-v="${v}">${v}</button>`).join('')}</div></div>`},
com(){return `<div class="c r"><input class="in" id="np" aria-label="اكتب" placeholder="شاركي فكرة أو سؤال"><button class="b sm" data-a="post">انشر</button></div><div class="c k-yl"><span class="chip">إعلان ممول</span><div class="w" style="margin-top:4px">[اسم العلامة]: [عرض]</div></div>${S.posts.map((p,i)=>`<div class="c"><div class="r">${av(i%2?'dad':'mom',34)}<div style="flex:1"><div class="w">${p.n}</div><div class="s">من ساعة</div></div></div><div style="margin:6px 0">${p.t}</div>${p.cm.map(c=>`<div class="s" style="padding:2px 0">${c}</div>`).join('')}<div class="r" style="margin-top:6px"><button class="chip${S.liked[i]?' on':''}" data-a="lk" data-v="${i}">إعجاب ${p.l+(S.liked[i]?1:0)}</button><input class="in" style="min-height:34px" id="ci${i}" aria-label="تعليق" placeholder="تعليق"><button class="chip" data-a="cm" data-v="${i}">أرسل</button></div></div>`).join('')}`}};
const RTG='<span class="s">&#9733; 4.6 (90)</span>';
const back=()=>`<button class="chip" data-a="go" data-v="">&#8594; رجوع</button>`;
const sheet=()=>{const sh=S.sheet;if(!sh)return '';const M=S.c=='eg'?['بطاقة بنكية','فودافون كاش','فوري','الدفع عند الاستلام']:['مدى','Apple Pay','STC Pay','تابي (تقسيط)','الدفع عند الاستلام'];const items=Object.keys(S.cart).filter(i=>S.cart[i]),sub=items.reduce((a,i)=>a+PR[i][2]*S.cart[i],0);let h='';
if(sh=='cart')h=`<div class="h">سلتك</div>${items.length?items.map(i=>`<div class="r"><div style="width:48px;background:${PR[i][3]};border-radius:12px">${art(PR[i][0])}</div><div style="flex:1"><div class="w">${PR[i][1]}</div><div class="s">${px(PR[i][2])}</div></div><button class="chip" data-a="qt" data-v="${i}" data-d="-1">-</button><b>${S.cart[i]}</b><button class="chip" data-a="qt" data-v="${i}" data-d="1">+</button></div>`).join('')+`<div class="r h"><span style="flex:1">المجموع</span><span>${px(sub)}</span></div><div class="row"><input class="in" aria-label="كود الخصم" placeholder="كود الخصم" style="flex:1"><button class="b sm" data-a="promo">طبّق</button></div><button class="b" data-a="sh" data-v="pay">كمّل للدفع</button>`:'<div class="s">السلة فاضية</div>'}`;
if(sh=='pay')h=`<div class="h">الدفع</div>${M.map((m,i)=>`<label class="c r"><input type="radio" name="m" ${S.pm==i?'checked':''} data-a="pm" data-v="${i}"><span class="w" style="flex:1">${m}</span></label>`).join('')}<div class="c"><div class="r"><span style="flex:1">المجموع</span><span>${px(sub)}</span></div>${S.c=='sa'?`<div class="r"><span style="flex:1">ضريبة القيمة المضافة 15%</span><span>${px(sub*.15)}</span></div>`:''}<div class="r h"><span style="flex:1">الإجمالي</span><span>${px(S.c=='sa'?sub*1.15:sub)}</span></div></div><button class="b" data-a="done">ادفع</button>`;
if(sh=='track'){const st=['تم الطلب','بيتجهز','في الطريق','وصل'];h=`<div class="h">${S.tr>=3?'وصل طلبك':'طلبك في الطريق'}</div><div class="sc"><i>&#128756;</i></div>${st.map((x,i)=>`<div class="r"><div class="chk ${i<=S.tr?'k-pk':'k-bl'}" style="width:24px;height:24px">${i<=S.tr?'&#10003;':''}</div><span class="w">${x}</span></div>`).join('')}${S.tr>=3?`<div class="s2">قيّم الطلب</div><div class="row">${[1,2,3,4,5].map(n=>`<button class="chip" data-a="rate">${n} &#9733;</button>`).join('')}</div>`:''}<button class="b o" data-a="sh" data-v="">إغلاق</button>`}
if(sh=='em')h=`<div class="tl k-pk" style="border-radius:20px;padding:14px"><div class="s2">بطاقة طوارئ</div><div class="h">${KID[S.kid].n}</div><div>فصيلة الدم O+ · الحساسية [ ]</div></div><div class="r"><button class="b" style="flex:1" data-a="toast" data-v="اتصال بالدكتور">دكتور الأطفال</button><button class="b o" style="flex:1" data-a="toast" data-v="اتصال بماما">ماما</button></div><button class="b o" data-a="sh" data-v="">إغلاق</button>`;
if(sh=='bk')h=`<div class="h">احجز موعد</div><div class="row">${['النهارده','بكرة','الخميس'].map(x=>`<button class="chip" data-a="toast" data-v="تم اختيار ${x}">${x}</button>`).join('')}</div><div class="row">${['4:00 م','5:00 م','6:00 م'].map(x=>`<button class="chip" data-a="toast" data-v="تم اختيار ${x}">${x}</button>`).join('')}</div><button class="b" data-a="book">تأكيد الحجز</button>`;
return `<div>${h}</div>`};
function R(keep){const sc=$('#sc'),y=sc.scrollTop;sc.className={home:'t-home',rt:'t-rt',ai:'t-ai',ex:'t-ex',me:'t-me'+S.kid}[S.tab];sc.innerHTML=VIEW[S.tab]();sc.scrollTop=keep?y:0;$('#nv').innerHTML=NV.map(n=>`<button class="nb${S.tab==n[0]?' on':''}" data-a="tab" data-v="${n[0]}"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${IC[n[0]]}"/></svg>${n[1]}</button>`).join('');$('#sh').innerHTML=sheet();$('#cb').textContent=S.c=='eg'?'مصر | السعودية':'السعودية | مصر'}
function toast(t){const e=$('#ts');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),1600)}
function boom(){for(let i=0;i<16;i++){const e=document.createElement('i');e.className='cf';e.style.cssText=`left:${40+Math.random()*20}%;background:${['#F2699F','#4FB4DA','#FFC94D','#5CCB9B','#8C7CE6'][i%5]};--x:${(Math.random()-.5)*260}px;--y:${-120-Math.random()*160}px`;$('#ph').appendChild(e);setTimeout(()=>e.remove(),900)}}
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ar-SA';speechSynthesis.speak(u)}catch(e){toast('الصوت غير مدعوم على الجهاز')}}
function newQ(){const n=1+Math.floor(Math.random()*6);S.game={n,o:[n,n%6+1,(n+1)%6+1].sort(()=>Math.random()-.5)}}
const upd=()=>{const v=$('#vp');if(v){v.style.width=S.pl.vp+'\%';$('#vt').textContent=tm(S.pl.vp*1.8)+' / 3:00'}const a=$('#ap');if(a){a.style.width=S.pl.ap+'\%';$('#at').textContent=tm(S.pl.ap*2.4)+' / 4:00'}$('#vid')&&$('#vid').classList.toggle('pl-on',!!S.pl.v);$('#aud')&&$('#aud').classList.toggle('pl-on',!!S.pl.a)};
setInterval(()=>{let ch=0;if(S.pl.v){S.pl.vp=Math.min(100,S.pl.vp+1);if(S.pl.vp>=100){S.pl.v=0;ch=1}}if(S.pl.a){S.pl.ap=Math.min(100,S.pl.ap+.8);if(S.pl.ap>=100){S.pl.a=0;ch=1}}upd();if(ch)R(1)},400);
const A={
tab(d){S.tab=d.v;S.sub=null;S.sheet=null;R()},go(d){S.tab='ex';S.sub=d.v||null;R()},kid(d){S.kid=d.v;R(1)},task(d){const k=S.kid+d.v;if(!S.done[k]){S.done[k]=1;S.stars++;boom()}else{S.done[k]=0;S.stars--}R(1)},an(d){S.ans[d.k]=d.v;R(1)},
calc(){const a=S.ans;if(!a.md||!a.fc||!a.sr||!a.sl||!a.wk){toast('جاوب على كل الأسئلة الأول');return}const sc=(a.md=='كويس')+(a.fc=='مركز')+(a.sr=='أقل من ساعة')+(['9 م','10 م'].includes(a.sl)),g=sc>=3;if(g){S.stars+=2;boom()}S.res=g?{k:'gn',t:'يوم ممتاز! ربحت نجمتين',m:'نوم منتظم وتركيز وشاشة قليلة. استمر.'}:{k:'or',t:'يوم محتاج انتباه',m:'جرّب تقليل الشاشة وتثبيت ميعاد النوم، وراجع نصايح المساعد.'};R(1)},
say(){say(TIP)},ask(d){S.chat.push(['me',d.v],['bt','...']);R(1);setTimeout(()=>{S.chat.pop();S.chat.push(['bt',RP[d.v]]);R(1)},700)},
send(){const v=$('#qi').value.trim();if(!v)return;const k=Object.keys(RP).find(x=>v.includes(x));S.chat.push(['me',v],['bt','...']);R(1);setTimeout(()=>{S.chat.pop();S.chat.push(['bt',k?RP[k]:'[رد تجريبي من المساعد]']);R(1)},700)},
sv(d){S.svc=d.v;R(1)},loc(){S.loc=!S.loc;toast(S.loc?'تم تفعيل الموقع':'تم إيقاف الموقع');R(1)},sel(d){S.sel=d.v===''?null:+d.v;R()},add(d){S.cart[d.v]=(S.cart[d.v]||0)+1;toast('اتضاف للسلة');R(1)},qt(d){S.cart[d.v]=Math.max(0,(S.cart[d.v]||0)+ +d.d);R(1)},promo(){toast('الكود تجريبي')},
sh(d){S.sheet=d.v||null;R(1)},pm(d){S.pm=+d.v},done(){S.sheet='track';S.tr=0;R(1);const n=()=>{if(S.sheet=='track'&&S.tr<3){S.tr++;R(1);setTimeout(n,1500)}};setTimeout(n,1500);S.cart={}},rate(){S.sheet=null;toast('شكراً على تقييمك');R(1)},book(){S.sheet=null;toast('تم الحجز');R(1)},toast(d){toast(d.v)},
pv(){S.pl.v=!S.pl.v;if(S.pl.v&&S.pl.vp>=100)S.pl.vp=0;R(1);upd()},pa(){S.pl.a=!S.pl.a;if(S.pl.a){S.pl.ap>=100&&(S.pl.ap=0);say('أهلاً بيك في بودكاست التطبيق. دي حلقة تجريبية.')}else speechSynthesis&&speechSynthesis.cancel();R(1);upd()},
seek(d,e,el){const r=el.getBoundingClientRect(),p=Math.round(100*(r.right-e.clientX)/r.width);S.pl[d.w=='v'?'vp':'ap']=Math.max(0,Math.min(100,p));upd()},
gm(d){if(+d.v==S.game.n){S.stars++;boom();toast('برافو! نجمة جديدة');newQ()}else toast('جرّب تاني');R(1)},
lk(d){S.liked[d.v]=!S.liked[d.v];R(1)},cm(d){const e=$('#ci'+d.v),v=e.value.trim();if(!v)return;S.posts[d.v].cm.push('أنا: '+v);R(1)},post(){const v=$('#np').value.trim();if(!v)return;S.posts.unshift({n:'أنا',t:v,l:0,cm:[]});R(1)},
cty(){S.c=S.c=='eg'?'sa':'eg';toast(S.c=='eg'?'مصر: الجنيه':'السعودية: الريال');R(1)},lang(){toast('النسخة الإنجليزية في التصميم')}};
document.addEventListener('click',e=>{const a=e.target.closest('[data-a]');if(!a||!A[a.dataset.a])return;if(a.tagName=='INPUT'&&a.type=='radio'){A[a.dataset.a](a.dataset);return}A[a.dataset.a](a.dataset,e,a)});
R();
